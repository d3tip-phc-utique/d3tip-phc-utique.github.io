title: "D3TIP"
description: "Site officiel du projet D3TIP (PHC Utique 2026)"
url: "https://d3tip-phc-utique.github.io"
baseurl: ""
theme: minima
minima:
  show_excerpts: false

# ---- Internationalisation -------------------------------------------------
# Langue utilisée en secours quand une page n'en déclare pas.
default_lang: fr

# Langues proposées par le sélecteur (ordre d'affichage).
languages:
  - code: fr
    label: FR
    name: "Français"
  - code: en
    label: EN
    name: "English"

# Ordre du menu principal, exprimé en CLES de page (page.key) et non en
# chemins de fichiers : le meme ordre sert donc pour toutes les langues.
nav_order:
  - home
  - team
  - events
  - publications
  - bibliography
  - partners

# ---- Valeurs par defaut ---------------------------------------------------
# Filet de securite : meme si une page oublie `lang` / `dir` dans son
# front matter, elle reste rattachee a la bonne langue.
defaults:
  - scope:
      path: "fr"
    values:
      lang: fr
      dir: ltr
      layout: page
  - scope:
      path: "en"
    values:
      lang: en
      dir: ltr
      layout: page
