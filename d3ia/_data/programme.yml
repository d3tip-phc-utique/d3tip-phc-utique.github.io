# PROGRAMME DES JOURNÉES D3IA
# Pour chaque créneau :
#   heure  : l'horaire
#   titre  : le titre de l'intervention
#   auteur : l'intervenant·e et son institution
#   type   : "pause" pour une pause, "pleniere" pour une conférence plénière (facultatif)
#   atelier: étiquette d'atelier, par exemple "Atelier de formation 1" (facultatif)
# Respectez bien les espaces en début de ligne.

- id: jeudi
  jour: Jeudi 5 novembre
  seances:

    - titre: Ouverture
      creneaux:
        - heure: 8h30
          type: pause
          titre: Accueil des participants
        - heure: 9h–9h30
          titre: Ouverture des journées
          liste:
            - M. Slim Driss, président de l'Université de Tunis
            - M. Ameur Cherif, président de l'Université de la Manouba
            - M. Mohamed Faker Klibi, directeur de l'École Supérieure des Sciences Économiques et Commerciales de Tunis
            - Giovanni Dotoli, responsable des Journées Mondiales des Dictionnaires
            - Mme Anissa Ben Hassine, directrice du laboratoire LARIME
            - Mme Soumaya Mejri (Université de Tunis) et M. Lichao Zhu (Université Paris Cité), organisateurs des Journées D<sub>3</sub>IA
        - heure: 9h30–10h
          type: pause
          titre: Pause-café

    - titre: "Modérateur : Lichao Zhu"
      creneaux:
        - heure: 10h–11h
          type: pleniere
          titre: Apports de l'IA en analyse linguistique du D<sub>3</sub> (Discours du Développement Durable). De la fine granularité sémantique et phraséologique
          auteur: Salah Mejri, Université Sorbonne Paris Nord
        - heure: 11h–11h30
          titre: "Des données textuelles en corpus aux données structurées dans ARTES : traitement lexicographique des collocations du discours sur le développement durable"
          auteur: Mojca Pecman, Université Paris Cité
        - heure: 11h30–12h
          titre: Tourisme culturel et IA
          auteur: Thouraya Ben Amor, Université de la Manouba
        - heure: 12h–12h30
          titre: "Comment publier une recherche qualitative en GRH : retour d'expérience"
          auteur: Lamia Hechiche, Université de Tunis
        - heure: 12h30–14h
          type: pause
          titre: Pause-déjeuner

    - titre: "Modérateur : Luis Meneses Lerín"
      creneaux:
        - heure: 14h–14h30
          titre: La lexicométrie en sciences humaines et sociales. Pourquoi faire ?
          auteur: Stéphane Patin, Université Paris Cité
        - heure: 14h30–15h
          titre: Développement Durable et IA
          auteur: Soumaya Mejri, Université de Tunis
        - heure: 15h–15h30
          titre: Le développement durable dans le <cite>Dictionnaire françois</cite> de Richelet
          auteur: Frédéric-Gaël Theuriau, Centre d'Études Supérieures de la Littérature de Tours
        - heure: 15h30–16h
          titre: Société civile et Développement Durable
          auteur: Sounayhawand Moalla, Université de la Manouba
        - heure: 16h–16h15
          type: pause
          titre: Pause-café

    - titre: "Modératrice : Imen Mizouri"
      creneaux:
        - heure: 16h15–16h45
          titre: "Corpus du développement durable : ressources, représentativité et outils"
          auteur: Lichao Zhu, Université Paris Cité
        - heure: 16h45–17h15
          titre: Deixis de la durabilité dans son « enveloppement » souterrain
          auteur: Eric Turcat, Oklahoma State University
        - heure: 17h15–17h45
          titre: Pollution des plages et IA
          auteur: Nour El Houda Yeferni et Rania Aloui, Université de Tunis
        - heure: 17h45–18h15
          titre: "Dictionnaire, discours génératif et développement durable : quand l'IA recompose la doxa"
          auteur: Maria Leo, chercheur libre
        - heure: 18h15–18h30
          type: pause
          titre: Débat et clôture de la première journée

- id: vendredi
  jour: Vendredi 6 novembre
  seances:

    - creneaux:
        - heure: 8h30
          type: pause
          titre: Accueil des participants

    - titre: "Modératrice : Thouraya Ben Amor"
      creneaux:
        - heure: 9h–9h30
          titre: Corpus lexicographique et phraséologie domaniale du développement durable
          auteur: Luis Meneses Lerín, Université d'Artois
        - heure: 9h30–10h
          titre: Il faut un nouveau dictionnaire du développement durable
          auteur: Celeste Boccuzzi, Université de Bari Aldo Moro
        - heure: 10h–10h30
          titre: "Classes sémantiques : expérimentations par l'IA"
          auteur: Imen Mizouri, Université Paris Cité
        - heure: 10h30–10h45
          type: pause
          titre: Pause-café

    - titre: "Modératrice : Soumaya Mejri"
      creneaux:
        - heure: 10h45–11h45
          atelier: Atelier de formation 1
          titre: Lexico 5
          auteur: Stéphane Patin, Université Paris Cité
        - heure: 11h45–12h45
          atelier: Atelier de formation 2
          titre: Corpus, outils informatiques et traitement linguistique
          auteur: Lichao Zhu, Imen Mizouri et Luis Meneses Lerín, Université Paris Cité / Université d'Artois
        - heure: 12h45–13h
          type: pause
          titre: Clôture des Journées D<sub>3</sub>IA
