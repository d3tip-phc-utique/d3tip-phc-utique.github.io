# PROGRAMME DES JOURNÉES D3IA (commun aux trois langues)
#
# Chaque séance a soit un intitulé (« ouverture »), soit une modération :
#   moderation: Nom Prénom   +   genre: m ou f
#
# Chaque créneau a une heure et, au choix :
#   pause: accueil | cafe | dejeuner | cloture_jour1 | cloture   (texte traduit automatiquement)
#   titre + auteur                                                (intervention, non traduite)
#   pleniere: true      → étiquette « Conférence plénière »
#   atelier: 1          → étiquette « Atelier de formation 1 »
#
# Mettez un titre entre guillemets s'il contient deux-points (« : »).

- id: jeudi
  jour:
    fr: Jeudi 5 novembre
    en: Thursday 5 November
    ar: الخميس 5 نوفمبر
  seances:

    - intitule: ouverture
      creneaux:
        - heure: 8h30
          pause: accueil
        - heure: 9h–9h30
          ouverture: true
          officiels:
            - fr: M. Slim Driss, président de l'Université de Tunis
              en: Slim Driss, President of the University of Tunis
              ar: Slim Driss، رئيس جامعة تونس
            - fr: M. Ameur Cherif, président de l'Université de la Manouba
              en: Ameur Cherif, President of the University of Manouba
              ar: Ameur Cherif، رئيس جامعة منوبة
            - fr: M. Mohamed Faker Klibi, directeur de l'École Supérieure des Sciences Économiques et Commerciales de Tunis
              en: Mohamed Faker Klibi, Director of the Higher School of Economic and Commercial Sciences of Tunis (ESSECT)
              ar: Mohamed Faker Klibi، مدير المدرسة العليا للعلوم الاقتصادية والتجارية بتونس
            - fr: Giovanni Dotoli, responsable des Journées Mondiales des Dictionnaires
              en: Giovanni Dotoli, head of the World Dictionary Days
              ar: Giovanni Dotoli، المسؤول عن الأيام العالمية للمعاجم
            - fr: Mme Anissa Ben Hassine, directrice du laboratoire LARIME
              en: Anissa Ben Hassine, Director of the LARIME laboratory
              ar: Anissa Ben Hassine، مديرة مخبر LARIME
            - fr: Mme Soumaya Mejri (Université de Tunis) et M. Lichao Zhu (Université Paris Cité), organisateurs des Journées D<sub>3</sub>IA
              en: Soumaya Mejri (University of Tunis) and Lichao Zhu (Université Paris Cité), organisers of the D<sub>3</sub>IA Days
              ar: Soumaya Mejri (جامعة تونس) وLichao Zhu (جامعة باريس سيتي)، منظّما أيام D<sub>3</sub>IA
        - heure: 9h30–10h
          pause: cafe

    - moderation: Lichao Zhu
      genre: m
      creneaux:
        - heure: 10h–11h
          pleniere: true
          titre: Apports de l'IA en analyse linguistique du D<sub>3</sub> (Discours du Développement Durable). De la fine granularité sémantique et phraséologique
          auteur: Salah Mejri, Université Sorbonne Paris Nord
        - heure: 11h–11h30
          titre: "Des données textuelles en corpus aux données structurées dans ARTES : traitement lexicographique des collocations du discours sur le développement durable"
          auteur: Mojca Pecman, Université Paris Cité
        - heure: 11h30–12h
          titre: Tourisme culturel et IA
          auteur: Thouraya Ben Amor, Université de la Manouba
        - heure: 12h–12h30
          titre: "Comment publier une recherche qualitative en GRH : retour d'expérience"
          auteur: Lamia Hechiche, Université de Tunis
        - heure: 12h30–14h
          pause: dejeuner

    - moderation: Luis Meneses Lerín
      genre: m
      creneaux:
        - heure: 14h–14h30
          titre: La lexicométrie en sciences humaines et sociales. Pourquoi faire ?
          auteur: Stéphane Patin, Université Paris Cité
        - heure: 14h30–15h
          titre: Développement Durable et IA
          auteur: Soumaya Mejri, Université de Tunis
        - heure: 15h–15h30
          titre: Le développement durable dans le <cite>Dictionnaire françois</cite> de Richelet
          auteur: Frédéric-Gaël Theuriau, Centre d'Études Supérieures de la Littérature de Tours
        - heure: 15h30–16h
          titre: Société civile et Développement Durable
          auteur: Sounayhawand Moalla, Université de la Manouba
        - heure: 16h–16h15
          pause: cafe

    - moderation: Imen Mizouri
      genre: f
      creneaux:
        - heure: 16h15–16h45
          titre: "Corpus du développement durable : ressources, représentativité et outils"
          auteur: Lichao Zhu, Université Paris Cité
        - heure: 16h45–17h15
          titre: Deixis de la durabilité dans son « enveloppement » souterrain
          auteur: Eric Turcat, Oklahoma State University
        - heure: 17h15–17h45
          titre: Pollution des plages et IA
          auteur: Nour El Houda Yeferni et Rania Aloui, Université de Tunis
        - heure: 17h45–18h15
          titre: "Dictionnaire, discours génératif et développement durable : quand l'IA recompose la doxa"
          auteur: Maria Leo, chercheur libre
        - heure: 18h15–18h30
          pause: cloture_jour1

